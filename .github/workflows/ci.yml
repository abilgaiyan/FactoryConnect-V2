name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore FactoryConnect.slnx
      - run: dotnet build FactoryConnect.slnx --no-restore --configuration Release
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bootstrap CLI and independent RSA-PSS interoperability
        run: node scripts/ci/bootstrap-cli-smoke.mjs
      - name: Exercise foundation host
        shell: bash
        run: |
          dotnet run --project backend/FactoryConnect.Api --no-build --configuration Release -- --urls http://127.0.0.1:5080 > backend.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          python3 scripts/ci/backend-smoke.py || { cat backend.log; exit 1; }

  sql-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Start disposable SQL Server 2022 Developer
        shell: bash
        run: |
          sql_password="$(openssl rand -hex 24)Aa1!"
          echo "::add-mask::$sql_password"
          echo "FC2_TEST_SQL=Server=127.0.0.1,1433;User ID=sa;Password=$sql_password;Encrypt=True;TrustServerCertificate=True;Connect Timeout=5" >> "$GITHUB_ENV"
          echo "FC2_SQL_PASSWORD=$sql_password" >> "$GITHUB_ENV"
          docker run -d --name fc2-sql -e ACCEPT_EULA=Y -e MSSQL_PID=Developer -e MSSQL_SA_PASSWORD="$sql_password" -p 127.0.0.1:1433:1433 mcr.microsoft.com/mssql/server:2022-CU20-ubuntu-22.04
      - name: Wait for SQL readiness
        shell: bash
        run: |
          for attempt in {1..60}; do
            if docker exec -e SQLCMDPASSWORD="$FC2_SQL_PASSWORD" fc2-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -Q 'SELECT 1' > /dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          echo 'SQL did not become ready'; exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build browser and install isolated Chromium acceptance
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium
      - name: Real OIDC HTTPS SQL Chromium acceptance
        env:
          FC2_BROWSER_ACCEPTANCE: '1'
        run: dotnet run --project tests/FactoryConnect.Sql.Acceptance --configuration Release -- --ingestion-only
      - name: Run first-machine HTTP TLS SQL demonstration
        run: dotnet run --project tests/FactoryConnect.Sql.Acceptance --configuration Release -- --ingestion-only
      - name: Whole-process single-machine acquisition host
        run: dotnet run --project tests/FactoryConnect.Sql.Acceptance --configuration Release -- --host-only
      - name: Real SQL acceptance (missing SQL is a failure)
        run: dotnet run --project tests/FactoryConnect.Sql.Acceptance --configuration Release
      - name: Upload synthetic SQL performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inventory-performance
          path: artifacts/performance/*.json
          if-no-files-found: warn
      - name: Upload first-machine ingestion evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-machine-ingestion
          path: artifacts/ingestion/*
          if-no-files-found: warn
      - name: Remove disposable SQL container
        if: always()
        run: docker rm -f fc2-sql || true
