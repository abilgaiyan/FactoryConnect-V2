# Local development only. Not a production deployment manifest.
services:
  identity-db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${FC2_KC_DB_PASSWORD:?Set FC2_KC_DB_PASSWORD in local shell}
    volumes:
      - fc2_keycloak_db:/var/lib/postgresql/data
    networks: [identity]
  identity:
    image: quay.io/keycloak/keycloak:26.4.2
    depends_on: [identity-db]
    restart: unless-stopped
    command: ["start", "--hostname=https://localhost:8443", "--https-certificate-file=/run/certs/tls.crt", "--https-certificate-key-file=/run/certs/tls.key", "--http-enabled=false"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://identity-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${FC2_KC_DB_PASSWORD:?Set FC2_KC_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${FC2_KC_ADMIN_USER:?Set FC2_KC_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${FC2_KC_ADMIN_PASSWORD:?Set FC2_KC_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - type: bind
        source: ${FC2_KC_CERT_DIR:?Set absolute FC2_KC_CERT_DIR}
        target: /run/certs
        read_only: true
    networks: [identity]
volumes:
  fc2_keycloak_db:
networks:
  identity:
    internal: false
